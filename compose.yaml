services:
  churn-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: customer-churn-ml:entrega-2
    container_name: customer-churn-api
    ports:
      - "${PORT:-8000}:8000"
    environment:
      MODEL_PATH: ${MODEL_PATH:-models/churn_pipeline.joblib}
      MODEL_METADATA_PATH: ${MODEL_METADATA_PATH:-models/model_metadata.json}
      MODEL_NAME: ${MODEL_NAME:-customer-churn-classifier}
      MODEL_VERSION: ${MODEL_VERSION:-1}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
